# KOMP IND Testing - execution configuration (safe to commit: NO secrets here).
# Override any key on the command line, e.g.  mvn clean test -Denv=preprod -Dclient.type=AOR
# Secrets live in config/secrets.local.properties (gitignored) or KOMP_* environment variables.

# --- environment -------------------------------------------------------------
# sandbox | preprod | production.  Default is a NON-production environment.
environment=sandbox
sandbox.base.url=https://sandbox.kompglobal.com
preprod.base.url=https://preprod.kompglobal.com
production.base.url=https://app.kompglobal.com
# Optional: separate EOR portal URL per environment. Defaults to <env>.base.url
# (sandbox uses ONE portal; role is decided by the account that signs in).
#sandbox.eor.base.url=
# Production runs are refused unless this is explicitly set to true.
allow.production=false

# --- browser -----------------------------------------------------------------
Browser=chrome
Headless=false

# --- waits (seconds) ---------------------------------------------------------
explicit.wait.seconds=20
email.poll.timeout.seconds=120
email.poll.interval.seconds=5
msa.generation.timeout.seconds=90
status.poll.timeout.seconds=60

# --- evidence ----------------------------------------------------------------
screenshot.on.pass=true
screenshot.on.fail=true
capture.network=true

# --- test scope --------------------------------------------------------------
# EOR or AOR. One type per execution.
client.type=EOR
client.country=India
# Subject fragment of the welcome mail (real subject: "Welcome to KOMP - Your client portal is ready")
client.welcome.subject.contains=Welcome to KOMP
yopmail.url=https://yopmail.com/en/
