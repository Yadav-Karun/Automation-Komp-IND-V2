# Copy to config/secrets.local.properties (gitignored) and fill in. Never commit real values.
# Alternatively set environment variables, e.g. KOMP_SANDBOX_ADMIN_EMAIL, KOMP_SANDBOX_ADMIN_PASSWORD,
# KOMP_CLIENT_TEST_PASSWORD (key upper-cased, dots -> underscores).

sandbox.admin.email=
sandbox.admin.password=
# EOR login falls back to the admin login when these are blank.
sandbox.eor.email=
sandbox.eor.password=

# AOR test user (Employee > AOR bulk upload and AOR Finance)
sandbox.aor.email=
sandbox.aor.password=

preprod.admin.email=
preprod.admin.password=

# Approved common permanent password set for each newly onboarded client
client.test.password=

# Read the mails of the EOR employees with a mail program instead of Yopmail (-Dmail.provider=imap; Yopmail's "confirm you're human" check never lets the test browser in).
# Gmail: turn on 2-Step Verification, create an APP PASSWORD (Google Account > Security > App passwords) and put it here - never the account password.
# The employees get the plus-address <local>+<name><m|f>@<domain> of imap.address.base.
imap.host=imap.gmail.com
imap.port=993
imap.user=
imap.password=
imap.address.base=
